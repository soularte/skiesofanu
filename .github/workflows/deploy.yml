name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */2 * * *"

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Restore social posts
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: .feed-cache
          key: social-feed-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: social-feed-
      - name: Build static site
        env:
          VK_FEED_TOKEN: ${{ github.event_name != 'pull_request' && secrets.VK_FEED_TOKEN || '' }}
        run: npm run build
      - name: Save social posts
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .feed-cache
          key: social-feed-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
