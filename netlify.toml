[build]
  command = "npm run build"
  publish = "dist"

# The primary site is hosted on GitHub Pages at skiesofanu.ru.
[[redirects]]
  from = "https://skiesofanu.com/*"
  to = "https://skiesofanu.ru/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.skiesofanu.com/*"
  to = "https://skiesofanu.ru/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://skiesofanu.com/*"
  to = "https://skiesofanu.ru/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.skiesofanu.com/*"
  to = "https://skiesofanu.ru/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://mc.webvisor.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self'; connect-src 'self' https://mc.yandex.ru https://mc.webvisor.org; frame-src 'self' https://t.me https://www.youtube.com https://youtube.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
